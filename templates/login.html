{% extends "base.html" %}

{% block title %}Portal Sign In | Global Shine{% endblock %}

{% block content %}
<section class="py-12 bg-slate-50 min-h-[70vh] flex items-center justify-center">
    <div class="max-w-md w-full mx-auto px-4">
        
        <div class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-xl space-y-5">
            
            <div class="text-center space-y-1.5">
                <div class="w-12 h-12 rounded-xl bg-slateDark text-itIndigo flex items-center justify-center text-xl mx-auto shadow">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="text-xl font-extrabold text-slateDark">Portal Sign In</h2>
                <p class="text-xs text-slate-500">Access Admin, Team, Partner, or Client Dashboard</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Username / ID *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" required placeholder="Enter username" class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-itIndigo focus:outline-none bg-white">
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1">Password *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" required placeholder="Enter password" class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-itIndigo focus:outline-none bg-white">
                    </div>
                </div>

                <button type="submit" class="w-full bg-slateDark hover:bg-slateNavy text-white font-bold text-xs py-2.5 rounded-lg shadow transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Secure Sign In</span>
                </button>
            </form>

            <!-- Quick Auto-Fill Credentials -->
            <div class="pt-3 border-t border-slate-100 space-y-2">
                <p class="text-[10px] font-bold text-slate-400 uppercase text-center">Quick Demo Credentials</p>
                <div class="grid grid-cols-3 gap-2 text-[10px]">
                    <button onclick="fillAuth('admin', 'admin123')" class="bg-indigo-50 hover:bg-indigo-100 text-itIndigo font-bold py-1.5 px-2 rounded border border-indigo-200">
                        Admin Demo
                    </button>
                    <button onclick="fillAuth('team1', 'team123')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-1.5 px-2 rounded border border-emerald-200">
                        Team Demo
                    </button>
                    <button onclick="fillAuth('partner1', 'partner123')" class="bg-blue-50 hover:bg-blue-100 text-itBlue font-bold py-1.5 px-2 rounded border border-blue-200">
                        Partner Demo
                    </button>
                </div>
            </div>

        </div>

    </div>
</section>

<script>
function fillAuth(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}

document.addEventListener('DOMContentLoaded', function() {
    var form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', function(e) {
            var u = (document.getElementById('username').value || '').trim();
            var p = (document.getElementById('password').value || '').trim();
            // Client-side authentication when hosted statically on GitHub Pages / Netlify or any static host
            if (window.location.port !== '5000') {
                e.preventDefault();
                if (u === 'admin' && p === 'admin123') {
                    window.location.href = 'admin.html';
                } else if (u === 'team1' && p === 'team123') {
                    window.location.href = 'team.html';
                } else if (u === 'partner1' && p === 'partner123') {
                    window.location.href = 'partner.html';
                } else {
                    alert('Invalid credentials!\nPlease use:\nAdmin: admin / admin123\nTeam: team1 / team123\nPartner: partner1 / partner123');
                }
            }
        });
    }
});
</script>
{% endblock %}
